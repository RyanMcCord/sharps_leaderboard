name: Daily update

# Once a day: wake the Aurora database, fetch new posts, read picks, grade finished
# games, then rebuild the site from the database. Aurora pauses again afterwards.
# 21:07 UTC is 5:07 PM Eastern during daylight saving time and 4:07 PM the rest of the
# year: after the previous night's games are final, and before most of tonight's start.
on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write   # commit the rebuilt site

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run the tracker
        id: run
        continue-on-error: true   # still save whatever finished, then fail the job below
        # Keys come from the repo's GitHub secrets. The database has no password: the AWS
        # access key signs a short-lived sign-in token for it on each run (DB_HOST).
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # Only used for a full-configuration cluster reached through the RDS Data API
          DB_CLUSTER_ARN: ${{ secrets.DB_CLUSTER_ARN }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
        run: python run.py all

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html   # the data itself lives in Aurora
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main   # in case something else was pushed during the run
            git push
          fi

      - name: Report a failed run
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Part of the tracker run failed. Open the 'Run the tracker' step above for the reason."
          exit 1
