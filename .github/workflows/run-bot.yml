name: Run a bot

# Shared runner that every bot's workflow calls. It checks the code, runs the bot's
# command, then commits whatever the bot published (e.g. its page under docs/).
on:
  workflow_call:
    inputs:
      bot:
        description: Bot name, as listed in xbots/registry.py
        required: true
        type: string
      command:
        description: The bot command to run
        required: false
        type: string
        default: all
      publish:
        description: Space-separated paths the bot writes that should be committed (optional)
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Check the code
        run: python -m unittest -q

      - name: Run ${{ inputs.bot }}
        id: run
        continue-on-error: true   # still save whatever finished, then fail the job below
        # Keys come from the repo's GitHub secrets. The database has no password: the AWS
        # access key signs a short-lived sign-in token for it on each run (DB_HOST).
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # Only used for a full-configuration cluster reached through the RDS Data API
          DB_CLUSTER_ARN: ${{ secrets.DB_CLUSTER_ARN }}
          DB_SECRET_ARN: ${{ secrets.DB_SECRET_ARN }}
        run: python -m xbots ${{ inputs.bot }} ${{ inputs.command }}

      - name: Save results
        if: inputs.publish != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.publish }}
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "${{ inputs.bot }}: update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main   # in case something else was pushed during the run
            git push
          fi

      - name: Report a failed run
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Part of the ${{ inputs.bot }} run failed. Open the 'Run ${{ inputs.bot }}' step above for the reason."
          exit 1
